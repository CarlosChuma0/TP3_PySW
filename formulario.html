<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- HEADER CON EL MENU -->
    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand text-white" href="index.html"><span class="sprite icon-airplane"></span>Turismo</a>

                <!-- Botón hamburguesa -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>

                        <!-- Dropdown -->
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                                Servicios
                            </a>

                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="destinos.html">Destinos</a></li>
                                <li><a class="dropdown-item" href="agencias.html">Agencias</a></li>
                                <li><a class="dropdown-item" href="precios.html">Precios</a></li>
                                <li><a class="dropdown-item" href="blog.html">Blog</a></li>
                            </ul>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="formulario.html">Contacto</a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
        <button id="darkModeToggle" aria-label="Toggle dark mode">
            <span id="icon" class="sprite icon-moon"></span>
        </button>
    </header>
    <main class="contenido-principal">
        <!-- FORMULARIO DE CONTACTO: todo lo que es el formulario, este solo deja enviar al llenar los datos correctamente, tiene un spinner de carga y luego de unos segundos un modal de confirmacion-->
        <section class="formulario-contacto">
            <h2>CONTACTO</h2>
            <form class="formulario" action="#" method="post">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="campo">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="campo">
                    <label for="motivo">Motivo del contacto</label>
                    <select id="motivo" name="motivo" required>
                        <option value="" disabled selected>Seleccione una opcion</option>
                        <option value="consulta">Consulta</option>
                        <option value="soporte">Soporte Tecnico</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>
                <!-- CHECK PARA SIMULAR UN BOTON DE ENVIO: ya que no podemos enviar el formulario, lo simulamos con un check de cuando se aprieta el boton, y cuando se confirma el envio -->
                <input type="checkbox" id="enviando" hidden>
                <label for="enviando" class="boton-enviar" role="button">Enviar</label>
                <!-- SPINNER: el spinner al enviar el formulario -->
                <div class="spinner-overlay">
                    <div class="spinner"></div>
                </div>
                <!-- MODAL DE CONFIRMACION: modal para indicar que se envio el formulario -->
                 <div class="modal-confirmacion">
                    <div class="modal-contenido">
                        <h3>Gracias por contactarnos!</h3>
                        <p>Su mensaje fue enviado correctamente</p>
                        <label for="enviando" class="boton-enviar">Cerrar</label>
                    </div>
                 </div>
            </form>
        </section>
    </main>
    <footer class="bg-dark text-white mt-5">
        <div class="container py-4">
            <div class="row g-4">

                <!-- NEWSLETTER -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="newsletter">
                        <h3>Suscribete al Newsletter!</h3>
                        <form>
                            <input type="email" class="form-control mb-2" placeholder="Ingresa tu correo" required>
                            <button type="submit" class="btn btn-primary w-100">Suscribirse</button>
                        </form>
                    </div>
                </div>

                <!-- REDES -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="redes">
                        <h3>Seguinos</h3>
                        <div class="d-flex flex-column gap-2">
                            <a href="#" target="_blank" class="d-flex align-items-center gap-2">
                                <span class="sprite icon-fb"></span>
                                <span>Facebook</span>
                            </a>
                            <a href="#" target="_blank" class="d-flex align-items-center gap-2">
                                <span class="sprite icon-ig"></span>
                                <span>Instagram</span>
                            </a>
                            <a href="#" target="_blank" class="d-flex align-items-center gap-2">
                                <span class="sprite icon-yt"></span>
                                <span>YouTube</span>
                            </a>
                            <a href="#" target="_blank" class="d-flex align-items-center gap-2">
                                <span class="sprite icon-x"></span>
                                <span>X</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- MAPA -->
                <div class="col-12 col-lg-4">
                    <div class="mapa">
                        <h3>Donde estamos</h3>
                        <iframe src="https://www.google.com/maps/embed?..." class="w-100" height="200" style="border:0;"
                            loading="lazy">
                        </iframe>
                    </div>
                </div>

            </div>
        </div>
    </footer>
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggleBtn = document.getElementById('darkModeToggle');
        const icon = document.getElementById('icon');

        if (localStorage.getItem('dark-mode') === 'true') {
            document.body.classList.add('dark-mode');
            icon.classList.remove('icon-moon');
            icon.classList.add('icon-sun');
        }

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const dark = document.body.classList.contains('dark-mode');
            if (dark) {
                icon.classList.remove('icon-moon');
                icon.classList.add('icon-sun');
            } else {
                icon.classList.remove('icon-sun');
                icon.classList.add('icon-moon');
            }
            localStorage.setItem('dark-mode', dark);
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
